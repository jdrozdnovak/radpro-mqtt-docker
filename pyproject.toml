# Requirement 6.1: Project metadata and tool configuration

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radpro-mqtt-bridge"
version = "0.1.0"
description = "Bridge RadPro Geiger counter devices to MQTT with Home Assistant auto-discovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "RadPro MQTT Bridge Contributors"}
]
keywords = ["radpro", "mqtt", "home-assistant", "geiger-counter", "radiation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pyserial==3.5",
    "paho-mqtt==2.1.0",
]

[project.optional-dependencies]
# Note: paho-mqtt 2.x ships its own type hints, so no types-paho-mqtt stubs -
# the 1.6 stubs would shadow them and type-check against the old callback API.
dev = [
    "pytest==9.1.1",
    "hypothesis==6.165.3",
    "pytest-mock==3.15.1",
    "black==26.5.1",
    "mypy==2.3.0",
    "ruff==0.17.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/radpro-mqtt-bridge"
Repository = "https://github.com/yourusername/radpro-mqtt-bridge"
Issues = "https://github.com/yourusername/radpro-mqtt-bridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

# Mypy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = "serial.*"
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests",
    "property: Property-based tests",
    "integration: Integration tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
# Kept in sync with [project.optional-dependencies].dev so `uv sync` and
# `uv pip install -e ".[dev]"` install the same tool versions as CI.
dev = [
    "black==26.5.1",
    "hypothesis==6.165.3",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "ruff==0.17.0",
]

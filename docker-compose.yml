services:
  radpro-mqtt-bridge:
    image: ghcr.io/jdrozdnovak/radpro-mqtt-docker:latest
    container_name: radpro-mqtt-bridge
    restart: unless-stopped
    
    # USB device mapping for RadPro device
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    
    # Environment variables
    environment:
      # Required: MQTT broker configuration
      - MQTT_HOST=ip
      - MQTT_PORT=1883
      
      # Optional: MQTT authentication
      - MQTT_USERNAME=
      - MQTT_PASSWORD=
      
      # Optional: Topic configuration
      - MQTT_TOPIC_PREFIX=radpro
      - HA_DISCOVERY_PREFIX=homeassistant
      
      # Optional: Device configuration
      - RADPRO_DEVICE=/dev/ttyACM0
      - POLL_INTERVAL=60
      
      # Optional: Logging
      - LOG_LEVEL=INFO
